services:
  container-labeler:
    build: .
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${PORT:-8766}:8765"
    environment:
      DATA_DIR: /data
      PORT: 8765
      SERVER_DATASET_ROOT: /server-dataset/container_images_verified
    volumes:
      - ./data:/data
      - ./data/server_dataset:/server-dataset

  dataset-audit:
    build:
      context: .
      dockerfile: Dockerfile.audit
    restart: unless-stopped
    ports:
      - "127.0.0.1:${AUDIT_PORT:-8767}:8767"
    environment:
      DATASET_ROOT: /server-dataset/container_images_verified
      AUDIT_STATE_DIR: /state
      PORT: 8767
    volumes:
      - ./data/server_dataset:/server-dataset:ro
      - ./data/audit_state:/state
